[project]
name = "insurance-compliance"
version = "1.0.0"
description = "AI-powered insurance compliance monitoring and analysis system"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "-v --tb=short -q"
# Markers for selective test execution
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests that need a running server",
]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.per-file-ignores]
# Test files that manipulate sys.path before imports
"backend/tests/test_pipeline.py" = ["E402"]
"backend/tests/test_non_compliant.py" = ["E402"]
"backend/tests/test_review.py" = ["E402"]
"backend/tests/test_compliance_system.py" = ["E402"]
# Legacy / backup code — bare excepts acceptable
"backend/backup_pre_migration/**" = ["E402", "E722"]
"backend/scraper.py" = ["E722"]
"backend/app/processing/parsers/legacy_document_parser.py" = ["E722"]
# __init__.py re-export patterns
"backend/app/ml/__init__.py" = ["F403", "F405"]
"backend/app/processing/__init__.py" = ["F403", "F405"]
# Main app files with conditional imports
"backend/api/main.py" = ["E402"]
"backend/app/ml/models/legacy_rule_classifier.py" = ["E402"]
